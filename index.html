<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Radar — What builders shipped while you slept.</title>
<meta name="description" content="A daily 5-minute brief on new repos, tweets, and product launches from the AI builder scene. Scored and summarized by an agent.">
<link rel="stylesheet" href="ds/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  body { font-family: 'Poppins', system-ui, sans-serif; color: #253858; }
  * { box-sizing: border-box; }
  a { color: inherit; }
  html { scroll-behavior: smooth; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="launches-long.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="email-bits.jsx"></script>
<script type="text/babel" src="dense-email.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { createRoot } = ReactDOM;

// Canonical copy variants — selecting a variant overwrites lead/highlight.
const HEADLINE_VARIANTS = {
  "shipped-slept": { lead: "What builders shipped", highlight: "while you slept." },
  "morning-brief": { lead: "The morning brief", highlight: "for AI builders." },
  "stop-scrolling": { lead: "Stop scrolling X.", highlight: "Read the digest." },
  "five-minutes":   { lead: "Five minutes of signal,", highlight: "before the noise." },
  custom:           null, // means: use whatever's in the text fields
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "headlineVariant": "shipped-slept",
  "headlineLead": "What builders shipped",
  "headlineHighlight": "while you slept.",
  "eyebrowText": "A morning brief for AI builders · ships at 9 AM PT",
  "subhead": "Every morning: new repos, tweets, and product launches from GitHub, Hacker News, and the X builder feed, scored and summarized by an agent, delivered in five minutes of reading.",
  "ctaText": "Subscribe",
  "showTopBar": true,
  "showTrustLine": true,
  "showPreviewFade": true,
  "previewHeight": 1400
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // When the user picks a headline variant, push its lead+highlight into the
  // text fields so the preview reflects the swap immediately. Picking "custom"
  // is a no-op — keeps whatever they've typed.
  const applyVariant = (key) => {
    const v = HEADLINE_VARIANTS[key];
    if (v) {
      setTweak({
        headlineVariant: key,
        headlineLead: v.lead,
        headlineHighlight: v.highlight,
      });
    } else {
      setTweak('headlineVariant', key);
    }
  };

  return (
    <>
      <LandingPage sample={window.LAUNCH_DATA_LONG} t={t} />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Headline">
          <TweakSelect
            label="Variant"
            value={t.headlineVariant}
            options={[
              { value: "shipped-slept", label: "What builders shipped…" },
              { value: "morning-brief", label: "The morning brief…" },
              { value: "stop-scrolling", label: "Stop scrolling X." },
              { value: "five-minutes", label: "Five minutes of signal…" },
              { value: "custom", label: "Custom (edit below)" },
            ]}
            onChange={applyVariant}
          />
          <TweakText
            label="Lead"
            value={t.headlineLead}
            onChange={(v) => setTweak({ headlineLead: v, headlineVariant: "custom" })}
          />
          <TweakText
            label="Highlight"
            value={t.headlineHighlight}
            onChange={(v) => setTweak({ headlineHighlight: v, headlineVariant: "custom" })}
          />
        </TweakSection>

        <TweakSection label="Supporting copy">
          <TweakText
            label="Eyebrow"
            value={t.eyebrowText}
            onChange={(v) => setTweak('eyebrowText', v)}
          />
          <TweakText
            label="Subhead"
            value={t.subhead}
            onChange={(v) => setTweak('subhead', v)}
          />
          <TweakText
            label="CTA button"
            value={t.ctaText}
            onChange={(v) => setTweak('ctaText', v)}
          />
        </TweakSection>

        <TweakSection label="Layout">
          <TweakToggle
            label="Top nav"
            value={t.showTopBar}
            onChange={(v) => setTweak('showTopBar', v)}
          />
          <TweakToggle
            label="Trust line under CTA"
            value={t.showTrustLine}
            onChange={(v) => setTweak('showTrustLine', v)}
          />
          <TweakToggle
            label="Fade + pill over preview"
            value={t.showPreviewFade}
            onChange={(v) => setTweak('showPreviewFade', v)}
          />
          <TweakSlider
            label="Preview crop height"
            value={t.previewHeight}
            min={500}
            max={2800}
            step={50}
            unit="px"
            onChange={(v) => setTweak('previewHeight', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
